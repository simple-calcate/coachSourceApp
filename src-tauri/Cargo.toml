[package]
name = "coach-source-app"
version = "0.1.0"
description = "个人训练数据采集与导出工具"
authors = ["jx235"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "coach_source_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd"] }

# 只用 rustls + 内置根证书，不碰系统 OpenSSL：
# 桌面和 Android 编译出的行为一致，也不用给安卓交叉编译 C 依赖。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
